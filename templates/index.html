<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB Modelo — Monte Carlo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ============ tokens (tema oscuro) ============ */
    :root {
      --bg:        #0f1115;
      --surface:   #171a21;
      --surface-2: #1e222b;
      --border:    #2a2f3a;
      --border-soft: #232833;
      --ink:       #f2f4f8;   /* texto primario */
      --ink-2:     #a9b0bd;   /* texto secundario */
      --ink-3:     #6d7482;   /* texto apagado */
      --accent:    #5c9ce6;   /* un solo acento (énfasis) */
      --accent-soft: rgba(92,156,230,.12);
      --ev:        #3fce8f;   /* reservado: jugadas +EV */
      --ev-soft:   rgba(63,206,143,.10);
      --danger:    #e66767;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
    }
    a { color: var(--accent); }

    /* ============ layout ============ */
    header.top {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15,17,21,.92); backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
    header.top .wrap { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; padding-bottom: 12px; }
    header.top h1 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
    header.top p  { font-size: 12px; color: var(--ink-3); }
    #status-indicator { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--ink-3); display: inline-block; }
    .dot.ok { background: var(--ev); } .dot.run { background: #e0a93e; } .dot.err { background: var(--danger); }

    main { padding: 22px 0 60px; }

    /* controles */
    .controls {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 22px;
    }
    .controls label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
    .controls input[type=date] {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--ink);
      border-radius: 9px; padding: 10px 12px; font: inherit; color-scheme: dark; min-width: 180px;
    }
    button { font: inherit; cursor: pointer; }
    .btn-primary {
      background: var(--accent); color: #0c1524; font-weight: 700; border: none;
      border-radius: 9px; padding: 11px 22px;
    }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; }
    .calib { font-size: 12px; color: var(--ink-3); font-family: ui-monospace, monospace; margin-top: 10px; width: 100%; }

    /* resumen del slate */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 5px 13px; }

    /* ============ tarjeta de juego ============ */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      margin-bottom: 22px; overflow: hidden;
    }
    .card-head {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start;
      padding: 18px 20px 14px; border-bottom: 1px solid var(--border-soft);
    }
    .team .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }
    .team h3 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; margin: 2px 0 3px; }
    .team .pitcher { font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
    .team .pitmeta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    .team.home { text-align: right; }
    .mid { text-align: center; padding-top: 4px; }
    .mid .lam { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .mid .lamlbl { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; margin-top: 1px; }
    .mid .park { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }

    .card-body { padding: 6px 20px 18px; }
    section.block { margin-top: 16px; }
    .block h4 {
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 8px;
    }
    .block h4 .note { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-3); }

    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px 26px; }

    /* ============ tablas ============ */
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th {
      font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      color: var(--ink-3); text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--border);
    }
    th:first-child, td:first-child { text-align: left; padding-left: 2px; }
    td { padding: 7px 8px; text-align: right; font-size: 15px; border-bottom: 1px solid var(--border-soft); color: var(--ink); }
    tr:last-child td { border-bottom: none; }
    td.lbl { color: var(--ink-2); font-size: 13.5px; font-weight: 600; }
    td.odds { color: var(--ink-2); font-family: ui-monospace, 'SF Mono', monospace; font-size: 13.5px; }
    td.odds.casa { color: var(--ink); font-weight: 600; }
    th.casa-h { color: var(--accent); }
    tr.fav td.lbl { color: var(--ink); }
    tr.fav td.lbl::before { content: '●'; color: var(--accent); font-size: 9px; margin-right: 6px; vertical-align: 1px; }
    tr.fav td { font-weight: 700; }
    tr.hl td { background: var(--accent-soft); }
    tr.hl td:first-child { border-left: 2px solid var(--accent); padding-left: 6px; border-radius: 2px 0 0 2px; }
    .hl-note { font-size: 11px; color: var(--accent); font-weight: 600; }

    /* marcadores */
    /* distribucion simulada */
    .dist { width: 100%; height: auto; display: block; overflow: visible; }
    .dist .bar-under { fill: var(--ink-3); }
    .dist .bar-over  { fill: var(--accent); }
    .dist .bar-cola  { opacity: .5; }              /* el último bin agrupa "N o más" */
    .dist .axis { fill: var(--ink-3); font-size: 9px; font-family: 'Inter', sans-serif; }
    .dist .linea { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; }
    .dist .linea-lbl { fill: var(--ink); font-size: 9.5px; font-weight: 700; font-family: 'Inter', sans-serif; }
    .dist .mediana { stroke: var(--ev); stroke-width: 2; }
    .dist .mediana-lbl { fill: var(--ev); font-size: 8px; font-weight: 700; font-family: 'Inter', sans-serif; }
    .dist-leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-2); margin-top: 6px; }
    .dist-leyenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
    .dist-leyenda .nota-skew { flex-basis: 100%; font-size: 11px; color: var(--ink-3); }

    /* aviso de dato estimado */
    .aviso {
      display: inline-block; font-size: 11px; font-weight: 600; color: #e0a93e;
      background: rgba(224,169,62,.12); border: 1px solid rgba(224,169,62,.3);
      border-radius: 6px; padding: 2px 8px; margin-top: 6px;
    }

    .scores { display: flex; flex-wrap: wrap; gap: 8px; }
    .score {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px;
      padding: 7px 13px; text-align: center;
    }
    .score .sc { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .score .pr { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }

    /* F5 */
    .f5wrap { border-top: 1px solid var(--border-soft); margin-top: 18px; padding-top: 14px; }
    .f5head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
    .f5head h4 { margin-bottom: 0; color: var(--accent); }
    .f5head span { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

    /* +EV */
    .ev {
      margin-top: 16px; background: var(--ev-soft); border: 1px solid rgba(63,206,143,.28);
      border-radius: 10px; padding: 12px 14px; overflow-x: auto;
    }
    .ev h4 { color: var(--ev); margin-bottom: 6px; }
    .ev table td { border-bottom-color: rgba(63,206,143,.12); }

    /* Tablero de valor: la vista del apostador, arriba de todo */
    .board {
      margin-bottom: 20px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px; overflow-x: auto;
    }
    .board h3 { font-size: 15px; margin-bottom: 3px; }
    .board .sub { font-size: 12.5px; color: var(--ink-3); margin-bottom: 12px; }
    .board table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .board th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--ink-3); text-align: right; padding: 5px 8px; font-weight: 700; }
    .board th:first-child, .board td:first-child { text-align: left; }
    .board td { padding: 6px 8px; border-bottom: 1px solid var(--border-soft); }
    .board .pick { font-weight: 700; }
    .board .odds { font-variant-numeric: tabular-nums; color: var(--ink-2); }
    .board .edge { font-weight: 700; color: var(--ev); font-variant-numeric: tabular-nums; }
    .board tr:last-child td { border-bottom: none; }
    .board .juego { color: var(--ink-2); font-weight: 600; }

    /* Etiquetas de confianza del mercado (segun la validacion historica) */
    .trust { font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; padding: 2px 7px; border-radius: 99px; vertical-align: middle;
      margin-left: 8px; white-space: nowrap; }
    .trust.solido { color: #1f9d63; background: rgba(63,206,143,.14); }
    .trust.margen { color: #b7791f; background: rgba(214,158,46,.16); }
    .trust.volado { color: var(--ink-3); background: var(--border-soft); }
    .trust-key { font-size: 12px; color: var(--ink-3); margin-top: 10px; line-height: 1.6; }

    /* bateo */
    details.bateo { margin-top: 16px; border-top: 1px solid var(--border-soft); padding-top: 12px; }
    details.bateo summary {
      cursor: pointer; font-size: 12px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--ink-3); list-style: none; user-select: none;
    }
    details.bateo summary::before { content: '▸ '; color: var(--ink-3); }
    details[open].bateo summary::before { content: '▾ '; }
    details.bateo summary:hover { color: var(--ink-2); }
    .bateo-team { margin-top: 12px; overflow-x: auto; }
    .bateo-team h5 { font-size: 12px; color: var(--ink-2); font-weight: 700; margin-bottom: 5px; }
    .bateo-team td, .bateo-team th { font-size: 13px; padding: 5px 7px; }
    .bateo-team td.name { text-align: left; font-weight: 600; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* estados */
    .skeleton { display: grid; gap: 16px; }
    .sk { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; height: 130px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    .empty { text-align: center; padding: 70px 0; color: var(--ink-2); }
    .empty .big { font-size: 44px; margin-bottom: 12px; }
    .error {
      background: rgba(230,103,103,.1); border: 1px solid rgba(230,103,103,.35);
      border-radius: 10px; padding: 14px; color: #f1a3a3; font-size: 14px;
    }
    .hidden { display: none; }
    footer { border-top: 1px solid var(--border-soft); padding: 16px 0; text-align: center; font-size: 12px; color: var(--ink-3); }

    @media (max-width: 640px) {
      .card-head { grid-template-columns: 1fr; }
      .team.home { text-align: left; }
      .mid { text-align: left; padding: 4px 0; }
    }
  </style>
</head>
<body>

  <header class="top">
    <div class="wrap">
      <div>
        <h1>⚾ MLB Modelo</h1>
        <p>Simulador Monte Carlo — v3</p>
      </div>
      <span id="status-indicator"><span class="dot"></span> Listo</span>
    </div>
  </header>

  <main class="wrap">

    <div class="controls">
      <div>
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
      <button id="btn-run" class="btn-primary">Correr modelo</button>
      <button id="btn-hoy" class="btn-ghost" title="Hoy">📅 Hoy</button>
      <p id="calibracion-info" class="calib hidden"></p>
    </div>

    <div id="skeleton" class="skeleton hidden">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div>
    </div>

    <div id="resultados" class="hidden">
      <div id="slate-summary" class="chips"></div>
      <div id="value-board"></div>
      <div id="game-cards"></div>
    </div>

    <div id="empty-state" class="empty hidden">
      <div class="big">📋</div>
      <p>Selecciona una fecha y presiona <strong>Correr modelo</strong></p>
      <p style="color:var(--ink-3); font-size:13px; margin-top:4px;">Aquí aparecerán las predicciones del día</p>
    </div>

    <div id="error" class="error hidden"></div>

  </main>

  <footer>MLB Modelo · Simulador Monte Carlo · Datos vía MLB StatsAPI</footer>

<script>
const $ = id => document.getElementById(id);
const btnRun = $('btn-run'), btnHoy = $('btn-hoy'), fechaInput = $('fecha');
const resultados = $('resultados'), gameCards = $('game-cards'), skeleton = $('skeleton');
const emptyState = $('empty-state'), errorDiv = $('error');
const slateSummary = $('slate-summary'), calibInfo = $('calibracion-info'), statusInd = $('status-indicator');
const valueBoard = $('value-board');

function fmtFecha(d) {
  const mm = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}
function toAPI(f) { const [y,m,d] = f.split('-'); return `${m}/${d}/${y}`; }

fechaInput.value = fmtFecha(new Date());
emptyState.classList.remove('hidden');
btnHoy.addEventListener('click', () => { fechaInput.value = fmtFecha(new Date()); });
btnRun.addEventListener('click', correr);

function setStatus(cls, txt) { statusInd.innerHTML = `<span class="dot ${cls}"></span> ${txt}`; }

async function correr() {
  const fecha = fechaInput.value;
  if (!fecha) return;
  btnRun.disabled = true; btnRun.textContent = 'Ejecutando…';
  resultados.classList.add('hidden'); errorDiv.classList.add('hidden');
  emptyState.classList.add('hidden'); skeleton.classList.remove('hidden');
  setStatus('run', 'Simulando…');

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 300000);
  try {
    const res = await fetch('/api/simular', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fecha: toAPI(fecha) }), signal: controller.signal,
    });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`Error ${res.status}: ${await res.text()}`);
    renderResultados(await res.json());
  } catch (err) {
    clearTimeout(timeoutId);
    errorDiv.textContent = '⚠ ' + (err.name === 'AbortError'
      ? 'La simulación tardó demasiado (>5 min). Reintenta o revisa la conexión a las APIs.'
      : err.message);
    errorDiv.classList.remove('hidden');
    setStatus('err', 'Error');
  } finally {
    skeleton.classList.add('hidden');
    btnRun.disabled = false; btnRun.textContent = 'Correr modelo';
  }
}

/* ---------- helpers de formato ---------- */
const pct = p => (p * 100).toFixed(1) + '%';
/* Momios — espejo de prob_a_momio/momio_mercado en modelo_diario.py.
   Si cambias las reglas allá, cámbialas aquí. Tres reglas del mercado:
   1) "-100" no existe: es lo mismo que +100 y se rotula EVEN.
   2) La casa carga su margen (vig) sobre el NO FAVORITO, no a partes iguales.
   3) Los momios van en escalones (5 / 10 / 25 según el tamaño). */
const VIG_TIPICO = 0.045;

function momioCrudo(p) { return p >= 0.5 ? 100 * p / (1 - p) : 100 * (1 - p) / p; }

function escalonMomio(m) {
  const paso = m < 200 ? 5 : (m < 400 ? 10 : 25);
  return Math.round(m / paso) * paso;
}

/* Precio justo: sin vig. El benchmark, no algo que alguien ofrezca. */
function momio(p) {
  if (p <= 0.01 || p >= 0.99) return '—';
  const m = Math.round(momioCrudo(p));
  if (m === 100) return 'EVEN';
  return (p >= 0.5 ? '-' : '+') + m;
}

/* Lo que una casa postearía de verdad: contra esto compara tu casino. */
function momioCasa(p) {
  if (p <= 0.01 || p >= 0.99) return '—';
  const pv = Math.min(p + VIG_TIPICO * (1 - p), 0.98);
  const m = escalonMomio(momioCrudo(pv));
  if (m === 100) return 'EVEN';
  return (pv >= 0.5 ? '-' : '+') + m;
}
const fx = (v, n=2) => (v === null || v === undefined) ? '—' : Number(v).toFixed(n);

/* Contexto del juego: solo se muestra lo que se aparta de lo normal, para
   que la tarjeta no se llene de "1.000". */
function contexto(g) {
  const partes = [];
  if (g.clima && Math.abs(g.clima - 1) > 0.005) {
    partes.push(`${g.clima > 1 ? '🌡 calor' : '🌡 frío'} ${((g.clima - 1) * 100).toFixed(0)}%`);
  }
  const fat = Math.max(g.fatiga_v ?? 1, g.fatiga_c ?? 1);
  if (fat > 1.02) partes.push('😮‍💨 bullpen cargado');
  const lu = [g.lineup_v ?? 1, g.lineup_c ?? 1];
  if (g.hay_lineup && lu.some(x => Math.abs(x - 1) > 0.015)) {
    partes.push('📋 lineup ' + (lu.some(x => x < 0.985) ? 'debilitado' : 'completo'));
  }
  return partes.length ? ' · ' + partes.join(' · ') : '';
}

/* Histograma de la distribución simulada del total.
   Es la salida cruda del Monte Carlo: las tablas dan probabilidades puntuales,
   esto muestra la FORMA — el pico, la asimetría y la cola derecha que
   justifican usar binomial negativa en vez de Poisson. */
function histograma(dist, linea) {
  if (!dist || !dist.length) return '';
  const W = 320, H = 96, PAD_B = 16, PAD_T = 6;
  const n = dist.length;
  const bw = W / n;
  const maxP = Math.max(...dist);
  const escala = p => (p / maxP) * (H - PAD_B - PAD_T);

  const barras = dist.map((p, k) => {
    const h = escala(p);
    // over = el total supera la línea; under = queda por debajo
    const cola = k === n - 1;                     // el último bin agrupa "N o más"
    const clase = (k > linea ? 'bar-over' : 'bar-under') + (cola ? ' bar-cola' : '');
    const x = k * bw;
    const y = H - PAD_B - h;
    return `<rect class="${clase}" x="${(x + 0.6).toFixed(1)}" y="${y.toFixed(1)}"
      width="${(bw - 1.2).toFixed(1)}" height="${Math.max(h, 0.6).toFixed(1)}" rx="1.5">
      <title>${cola ? k + ' o más' : k} carreras — ${pct(p)}</title></rect>`;
  }).join('');

  // marcas del eje cada 5 carreras; el último tick lleva "+" (bin agrupado)
  const ticks = dist.map((_, k) => k).filter(k => k % 5 === 0 || k === n - 1).map(k =>
    `<text class="axis" x="${(k * bw + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${k}${k === n - 1 ? '+' : ''}</text>`
  ).join('');

  // La línea de totales cae sobre la MEDIA (el total esperado).
  const xLinea = (linea + 1) * bw;
  const marca = `
    <line class="linea" x1="${xLinea.toFixed(1)}" y1="${PAD_T - 4}" x2="${xLinea.toFixed(1)}" y2="${H - PAD_B}"/>
    <text class="linea-lbl" x="${(xLinea + 4).toFixed(1)}" y="${PAD_T + 3}">${linea}</text>`;

  // Mediana: el punto 50/50 real. En una distribución sesgada a la derecha (como
  // el béisbol) la mediana queda A LA IZQUIERDA de la media -> por eso el over de
  // la línea 'esperada' suele salir <50% aunque el modelo no favorezca el under.
  let acum = 0, mediana = n - 1;
  for (let k = 0; k < n; k++) { acum += dist[k]; if (acum >= 0.5) { mediana = k; break; } }
  const xMed = (mediana + 0.5) * bw;
  const marcaMed = `
    <line class="mediana" x1="${xMed.toFixed(1)}" y1="${H - PAD_B - 4}" x2="${xMed.toFixed(1)}" y2="${H - PAD_B}"/>
    <text class="mediana-lbl" x="${xMed.toFixed(1)}" y="${H - PAD_B + 9}" text-anchor="middle">50/50</text>`;

  const pOver = dist.reduce((s, p, k) => s + (k > linea ? p : 0), 0);
  return `
    <svg class="dist" viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Distribución de carreras totales simuladas; línea en ${linea}, mediana en ${mediana}">
      ${barras}${ticks}${marca}${marcaMed}
    </svg>
    <div class="dist-leyenda">
      <span><i style="background:var(--accent)"></i>Over ${linea} · ${pct(pOver)}</span>
      <span><i style="background:var(--ink-3)"></i>Under · ${pct(1 - pOver)}</span>
      <span class="nota-skew">el típico (50/50) cae en ${mediana}: el béisbol reparte más juegos abajo del promedio</span>
    </div>`;
}

/* ---------- confianza de cada mercado (según la validación histórica) ----------
   Sobre 653 juegos calificados contra resultados reales de MLB:
     · Totales del juego: Brier 0.246 < 0.25 -> le gana al volado. SÓLIDO.
     · Moneyline y run line: Brier ~0.251 -> apenas una moneda. Tómalo suave.
     · F5 y NRFI: muestra chica / señal marginal. Informativo. */
const TRUST = {
  total: ['solido', 'sólido'],
  ml:    ['volado', '≈ volado'],
  rl:    ['volado', '≈ volado'],
  f5:    ['margen', 'marginal'],
  nrfi:  ['margen', 'marginal'],
};
function trustBadge(tipo) {
  const t = TRUST[tipo];
  return t ? `<span class="trust ${t[0]}">${t[1]}</span>` : '';
}
function mercadoTipo(m) {
  m = (m || '').toUpperCase();
  if (m.startsWith('TOT5') || m.startsWith('ML5') || m.startsWith('RL5') || m.includes('F5')) return 'f5';
  if (m.startsWith('NRFI') || m.startsWith('YRFI')) return 'nrfi';
  if (m.startsWith('TOT')) return 'total';
  if (m.startsWith('RL')) return 'rl';
  return 'ml';
}

/* La inclinación del modelo en cada juego: el total (mercado sólido) y el ML. */
function leansDeJuego(g) {
  const totalEsp = g.lam_v + g.lam_c;
  let ln = null, best = 99;
  for (const k of Object.keys(g.overs)) {
    const d = Math.abs(parseFloat(k) - totalEsp);
    if (d < best) { best = d; ln = k; }
  }
  const pOver = g.overs[ln], over = pOver >= 0.5;
  const total = { pick: `${over ? 'Over' : 'Under'} ${ln}`, p: over ? pOver : 1 - pOver,
                  fuerza: Math.abs(pOver - 0.5) };
  const casa = g.p_casa >= g.p_visita;
  const ml = { pick: casa ? g.casa : g.visita, p: casa ? g.p_casa : g.p_visita };
  return { g, total, ml };
}

/* El tablero de arriba: lo primero que ve un apostador. Con líneas conectadas
   muestra el +EV real; sin ellas, las inclinaciones del modelo a momio justo. */
function pintarTablero(data) {
  if (!data.juegos.length) { valueBoard.innerHTML = ''; return; }

  const evs = [];
  for (const g of data.juegos)
    for (const j of (g.jugadas_valor || [])) evs.push({ g, j });

  if (data.hay_odds && evs.length) {
    evs.sort((a, b) => b.j.ev - a.j.ev);
    valueBoard.innerHTML = `<div class="board">
      <h3>💰 Valor contra el mercado (+EV)</h3>
      <div class="sub">Donde tu casa paga mejor que la probabilidad del modelo. Ordenado por ventaja.</div>
      <table>
        <thead><tr><th>Juego</th><th>Mercado</th><th>Pick</th><th>Momio</th><th>Modelo</th><th>Ventaja</th><th>Casa</th></tr></thead>
        <tbody>${evs.map(({ g, j }) => `<tr>
          <td class="juego">${g.visita.split(' ').pop()} @ ${g.casa.split(' ').pop()}</td>
          <td>${j.mercado}${j.linea !== '' ? ' ' + j.linea : ''} ${trustBadge(mercadoTipo(j.mercado))}</td>
          <td class="pick">${j.pick}</td>
          <td class="odds">${j.momio > 0 ? '+' : ''}${j.momio}</td>
          <td>${pct(j.p_modelo)}</td>
          <td class="edge">+${pct(j.ev)}</td>
          <td class="odds">${j.libro}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
    return;
  }

  const leans = data.juegos.map(leansDeJuego).sort((a, b) => b.total.fuerza - a.total.fuerza);
  valueBoard.innerHTML = `<div class="board">
    <h3>📌 Inclinaciones del modelo</h3>
    <div class="sub">Sin líneas de mercado conectadas: estos son los momios <b>justos</b> del modelo. Compáralos con tu casa — si te pagan más que esto, hay valor. Ordenado por la fuerza de la señal de totales, el mercado que sí aporta.</div>
    <table>
      <thead><tr><th>Juego</th><th>Total ${trustBadge('total')}</th><th>Justo</th><th>Moneyline ${trustBadge('ml')}</th><th>Justo</th></tr></thead>
      <tbody>${leans.map(({ g, total, ml }) => `<tr>
        <td class="juego">${g.visita.split(' ').pop()} @ ${g.casa.split(' ').pop()}</td>
        <td class="pick">${total.pick} · ${pct(total.p)}</td>
        <td class="odds">${momio(total.p)}</td>
        <td class="pick">${ml.pick.split(' ').pop()} · ${pct(ml.p)}</td>
        <td class="odds">${momio(ml.p)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="trust-key">
      <span class="trust solido">sólido</span> le gana al volado en 653 juegos ·
      <span class="trust volado">≈ volado</span> apenas mejor que una moneda, tómalo suave ·
      <span class="trust margen">marginal</span> muestra chica, informativo
    </div>
  </div>`;
}

/* fila: etiqueta | prob | momio justo (fav = énfasis) */
const filaPM = (lbl, p, fav) =>
  `<tr class="${fav ? 'fav' : ''}"><td class="lbl">${lbl}</td><td>${pct(p)}</td>` +
  `<td class="odds">${momio(p)}</td><td class="odds casa">${momioCasa(p)}</td></tr>`;

/* ---------- render ---------- */
function renderResultados(data) {
  resultados.classList.remove('hidden');
  gameCards.innerHTML = '';
  valueBoard.innerHTML = '';

  slateSummary.innerHTML = `
    <span class="chip">🎮 ${data.juegos.length} juegos modelables</span>
    <span class="chip">📊 Total promedio del slate: ${data.total_promedio_slate ?? '—'}</span>
    <span class="chip">💰 ${data.total_jugadas_valor} jugadas +EV</span>`;

  const c = data.calibracion;
  calibInfo.textContent = `amortigua=${c.amortigua} · dispersion_k=${c.dispersion_k} · base=${c.base} · ${data.hay_odds ? 'con líneas de mercado' : 'sin ODDS_API_KEY'}`;
  calibInfo.classList.remove('hidden');

  if (!data.juegos.length) {
    gameCards.innerHTML = `<div class="empty"><div class="big">🔮</div>
      <p>No hay juegos modelables para esta fecha</p>
      <p style="color:var(--ink-3);font-size:13px;">(sin abridores anunciados o todos ya iniciados)</p></div>`;
    setStatus('ok', '0 juegos');
    return;
  }

  pintarTablero(data);
  for (const g of data.juegos) gameCards.appendChild(cardJuego(g));
  setStatus('ok', `${data.juegos.length} juegos`);
}

function cardJuego(g) {
  const card = document.createElement('article');
  card.className = 'card';
  const totalEsp = g.lam_v + g.lam_c;
  const favCasa = g.p_casa >= g.p_visita;

  /* --- totales O/U: marca la línea más cercana al total esperado --- */
  const lineasOU = Object.entries(g.overs);
  let cercana = null, mejor = 99;
  for (const [ln] of lineasOU) {
    const d = Math.abs(parseFloat(ln) - totalEsp);
    if (d < mejor) { mejor = d; cercana = ln; }
  }
  const filasOU = lineasOU.map(([ln, p]) => `
    <tr class="${ln === cercana ? 'hl' : ''}">
      <td class="lbl">${ln} ${ln === cercana ? `<span class="hl-note">≈ esperado</span>` : ''}</td>
      <td>${pct(p)}</td><td class="odds">${momio(p)}</td><td class="odds casa">${momioCasa(p)}</td>
      <td>${pct(1 - p)}</td><td class="odds">${momio(1 - p)}</td><td class="odds casa">${momioCasa(1 - p)}</td>
    </tr>`).join('');

  /* --- totales por equipo --- */
  const ttLineas = Object.keys(g.tt_visita || {});
  const filasTT = ttLineas.map(ln => `
    <tr>
      <td class="lbl">${ln}</td>
      <td>${pct(g.tt_visita[ln])}</td><td>${pct(1 - g.tt_visita[ln])}</td>
      <td>${pct(g.tt_casa[ln])}</td><td>${pct(1 - g.tt_casa[ln])}</td>
    </tr>`).join('');

  /* --- marcadores más probables --- */
  const scoresHTML = (g.marcadores || []).map(mc => `
    <div class="score"><div class="sc">${mc.visita}–${mc.casa}</div><div class="pr">${pct(mc.p)}</div></div>`).join('');

  /* --- distribución de las 50,000 simulaciones --- */
  const distHTML = histograma(g.dist_total, parseFloat(cercana));

  /* --- F5 --- */
  const f = g.f5;
  const favF5 = Math.max(f.p_casa, f.p_visita, f.p_empate);
  const filasF5OU = Object.entries(f.overs).map(([ln, p]) => `
    <tr><td class="lbl">${ln}</td>
      <td>${pct(p)}</td><td class="odds">${momio(p)}</td><td class="odds casa">${momioCasa(p)}</td>
      <td>${pct(1 - p)}</td><td class="odds">${momio(1 - p)}</td><td class="odds casa">${momioCasa(1 - p)}</td></tr>`).join('');

  /* --- jugadas +EV --- */
  let evHTML = '';
  if (g.jugadas_valor && g.jugadas_valor.length) {
    evHTML = `
      <div class="ev">
        <h4>💰 Jugadas con valor (+EV)</h4>
        <table>
          <thead><tr><th>Mercado</th><th style="text-align:left">Pick</th><th>Momio</th><th>Modelo</th><th>Mercado</th><th>EV</th><th>Casa</th></tr></thead>
          <tbody>${g.jugadas_valor.map(j => `
            <tr>
              <td class="lbl">${j.mercado}${j.linea !== '' ? ' ' + j.linea : ''}</td>
              <td style="text-align:left;font-weight:700">${j.pick}</td>
              <td class="odds">${j.momio > 0 ? '+' : ''}${j.momio}</td>
              <td>${pct(j.p_modelo)}</td><td>${pct(j.p_mercado)}</td>
              <td style="color:var(--ev);font-weight:700">+${pct(j.ev)}</td>
              <td class="odds">${j.libro}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  /* --- bateo --- */
  const ladoBateo = (key, nombre) => {
    const bs = (g.bateo && g.bateo[key]) || [];
    if (!bs.length) return '';
    return `
      <div class="bateo-team">
        <h5>${nombre}</h5>
        <table>
          <thead><tr>
            <th>#</th><th style="text-align:left">Bateador</th><th>Pos</th><th>Mano</th>
            <th>AVG</th><th>Últ 7d</th><th>AVG esp</th><th>Hits esp</th><th>≥1 hit</th>
          </tr></thead>
          <tbody>${bs.map(b => `
            <tr>
              <td class="lbl">${b.orden}</td>
              <td class="name">${b.nombre}</td>
              <td class="odds">${b.posicion}</td><td class="odds">${b.bat_side || '?'}</td>
              <td>${b.avg_season || '—'}</td>
              <td>${b.avg_7d ? b.avg_7d.toFixed(3) : '—'}</td>
              <td style="font-weight:700">${b.prediccion.avg_pred.toFixed(3)}</td>
              <td>${b.prediccion.hits_esp.toFixed(1)}</td>
              <td style="font-weight:700">${pct(b.prediccion.p_hit_1 + b.prediccion.p_hit_2)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  };
  const bateoInner = ladoBateo('away', g.visita) + ladoBateo('home', g.casa);
  const bateoHTML = `
    <details class="bateo">
      <summary>Pronóstico de hits por bateador</summary>
      ${bateoInner || '<p style="color:var(--ink-3);font-size:13px;margin-top:8px;">Alineación no disponible aún (se anuncia ~1h antes del juego)</p>'}
    </details>`;

  card.innerHTML = `
    <div class="card-head">
      <div class="team away">
        <span class="tag">Visita</span>
        <h3>${g.visita}</h3>
        <p class="pitcher">${g.abridor_v} · ${g.mano_v ?? '?'}</p>
        <p class="pitmeta">FIP ${fx(g.fip_v)}${g.fip_v_reciente ? ` (rec ${fx(g.fip_v_reciente)})` : ''} · ${fx(g.ip_v,1)} IP · bullpen ${fx(g.bullpen_v)}</p>
      </div>
      <div class="mid">
        <div class="lam">${fx(g.lam_v)} — ${fx(g.lam_c)}</div>
        <div class="lamlbl">Carreras esperadas</div>
        <div class="park">Total ${fx(totalEsp)} · Park ${fx(g.park)}${contexto(g)}</div>
      </div>
      <div class="team home">
        <span class="tag">Casa</span>
        <h3>${g.casa}</h3>
        <p class="pitcher">${g.abridor_c} · ${g.mano_c ?? '?'}</p>
        <p class="pitmeta">FIP ${fx(g.fip_c)}${g.fip_c_reciente ? ` (rec ${fx(g.fip_c_reciente)})` : ''} · ${fx(g.ip_c,1)} IP · bullpen ${fx(g.bullpen_c)}</p>
      </div>
      ${g.estimado ? `<div style="grid-column:1/-1"><span class="aviso">⚠ ${
        [g.estimado_v ? g.abridor_v : null, g.estimado_c ? g.abridor_c : null].filter(Boolean).join(' y ')
      } sin estadísticas de temporada — estimado a nivel de reemplazo</span></div>` : ''}
    </div>

    <div class="card-body">
      <div class="cols">
        <section class="block">
          <h4>Moneyline ${trustBadge('ml')}</h4>
          <table>
            <thead><tr><th>Equipo</th><th>Prob</th><th>Justo</th><th>Línea casa</th></tr></thead>
            <tbody>
              ${filaPM(g.visita, g.p_visita, !favCasa)}
              ${filaPM(g.casa, g.p_casa, favCasa)}
            </tbody>
          </table>
        </section>

        <section class="block">
          <h4>Run line ${trustBadge('rl')}</h4>
          <table>
            <thead><tr><th>Equipo</th><th>Prob</th><th>Justo</th><th>Línea casa</th></tr></thead>
            <tbody>
              ${filaPM(`${g.visita} +1.5`, g.p_visita_rl, g.p_visita_rl >= 0.5)}
              ${filaPM(`${g.casa} −1.5`, g.p_casa_rl, g.p_casa_rl >= 0.5)}
            </tbody>
          </table>
        </section>
      </div>

      <div class="cols">
        <section class="block">
          <h4>Totales del juego ${trustBadge('total')} <span class="note">(over / under)</span></h4>
          <table>
            <thead><tr><th>Línea</th><th>Over</th><th>Justo</th><th>Casa</th><th>Under</th><th>Justo</th><th>Casa</th></tr></thead>
            <tbody>${filasOU}</tbody>
          </table>
        </section>

        <div>
          <section class="block">
            <h4>Totales por equipo <span class="note">(over / under)</span></h4>
            <table>
              <thead><tr><th>Línea</th><th>${g.visita.split(' ').pop()} O</th><th>U</th><th>${g.casa.split(' ').pop()} O</th><th>U</th></tr></thead>
              <tbody>${filasTT}</tbody>
            </table>
          </section>

          <section class="block">
            <h4>Marcadores más probables <span class="note">(visita–casa)</span></h4>
            <div class="scores">${scoresHTML}</div>
          </section>

          <section class="block">
            <h4>Distribución simulada <span class="note">(50,000 juegos)</span></h4>
            ${distHTML}
          </section>
        </div>
      </div>

      <div class="f5wrap">
        <div class="f5head">
          <h4>Primeras 5 entradas (F5)</h4>
          <span>carreras esp: ${fx(f.lam_v)} — ${fx(f.lam_c)} (total ${fx(f.lam_v + f.lam_c)})</span>
        </div>
        <div class="cols">
          <section class="block">
            <h4>ML 3 vías ${trustBadge('f5')}</h4>
            <table>
              <thead><tr><th>Resultado</th><th>Prob</th><th>Justo</th><th>Línea casa</th></tr></thead>
              <tbody>
                ${filaPM(g.visita, f.p_visita, f.p_visita === favF5)}
                ${filaPM('Empate', f.p_empate, f.p_empate === favF5)}
                ${filaPM(g.casa, f.p_casa, f.p_casa === favF5)}
              </tbody>
            </table>
          </section>

          <section class="block">
            <h4>Run line F5 (±0.5) ${trustBadge('f5')}</h4>
            <table>
              <thead><tr><th>Equipo</th><th>Prob</th><th>Justo</th><th>Línea casa</th></tr></thead>
              <tbody>
                ${filaPM(`${g.visita} −0.5`, f.p_visita, false)}
                ${filaPM(`${g.visita} +0.5`, f.rl_visita, f.rl_visita >= 0.5)}
                ${filaPM(`${g.casa} −0.5`, f.p_casa, false)}
                ${filaPM(`${g.casa} +0.5`, f.rl_casa, f.rl_casa >= 0.5)}
              </tbody>
            </table>
          </section>

          <section class="block">
            <h4>Totales F5 ${trustBadge('f5')}</h4>
            <table>
              <thead><tr><th>Línea</th><th>Over</th><th>Justo</th><th>Casa</th><th>Under</th><th>Justo</th><th>Casa</th></tr></thead>
              <tbody>${filasF5OU}</tbody>
            </table>
          </section>

          ${g.nrfi ? `
          <section class="block">
            <h4>1ª entrada (NRFI / YRFI) ${trustBadge('nrfi')}</h4>
            <table>
              <thead><tr><th>Resultado</th><th>Prob</th><th>Justo</th><th>Línea casa</th></tr></thead>
              <tbody>
                ${filaPM('NRFI · sin carreras', g.nrfi.nrfi, g.nrfi.nrfi >= 0.5)}
                ${filaPM('YRFI · alguien anota', g.nrfi.yrfi, g.nrfi.yrfi >= 0.5)}
                ${filaPM(`${g.visita} anota`, g.nrfi.anota_visita, false)}
                ${filaPM(`${g.casa} anota`, g.nrfi.anota_casa, false)}
              </tbody>
            </table>
          </section>` : ''}
        </div>
      </div>

      ${evHTML}
      ${bateoHTML}
    </div>`;
  return card;
}
</script>

</body>
</html>
