name: Tests modelo
on:
  push:
    branches: [main]
    paths: ['**.py', 'requirements.txt', '.github/workflows/test-modelo.yml']
  pull_request:
    paths: ['**.py', 'requirements.txt', '.github/workflows/test-modelo.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile *.py
      - run: python -m unittest discover -s tests -v
